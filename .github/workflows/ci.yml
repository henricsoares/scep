name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups
      - name: Run backend CI validation
        run: make ci
      - name: Build Docker images
        run: |
          docker build -t scep-backend ./backend
          docker build -t scep-frontend ./frontend
          docker build -t scep-simulation-engine ./simulation-engine
